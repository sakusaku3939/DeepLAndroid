name: Screenshot Diff Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  workflow_run:
    workflows: [ "Capture WebView Screenshots" ]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  compare-screenshots:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      test-outcome: ${{ steps.screenshot-tests.outcome }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --max-workers=2

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run screenshot tests
        id: screenshot-tests
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash .github/scripts/run_screenshot_tests.sh

      - name: Prepare report for GitHub Pages
        run: |
          REPORT_DIR=app/build/reports/shot/debug/verification
          test -s "$REPORT_DIR/index.html"
          test -s "$REPORT_DIR/TEST-Shot.xml"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse("app/build/reports/shot/debug/verification/TEST-Shot.xml")
          if not report.findall(".//testcase"):
              raise SystemExit("Screenshot report contains no tests; refusing to publish")
          PY
          mkdir -p public
          cp -r "$REPORT_DIR"/. public/
      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Upload comparison results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-comparison-${{ github.run_id }}
          path: |
            app/build/reports/shot/debug/verification/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/screenshot-diagnostics/
            public/
          retention-days: 30

  deploy:
    needs: compare-screenshots
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  check-result:
    needs: [ compare-screenshots, deploy ]
    runs-on: ubuntu-latest
    steps:
      - name: Download comparison artifact
        uses: actions/download-artifact@v4
        with:
          name: screenshot-comparison-${{ github.run_id }}

      - name: Fail job if diff found
        env:
          TEST_OUTCOME: ${{ needs.compare-screenshots.outputs.test-outcome }}
        run: |
          REPORT=$(find . -type f -name "TEST-Shot.xml" | head -n 1)
          if [ -z "$REPORT" ]; then
            echo "❌ TEST-Shot.xml not found"
            exit 1
          fi
          if [ "$TEST_OUTCOME" != "success" ] || grep -Eq "<(failure|error)" "$REPORT"; then
            echo "❌ Screenshot diff detected"
            exit 1
          else
            echo "✅ No screenshot diff detected"
          fi
